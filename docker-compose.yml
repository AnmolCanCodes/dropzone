services:
  postgres:
    image: postgres:17
    container_name: dropzone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dropzone
      POSTGRES_PASSWORD: change-me      # local dev only
      POSTGRES_DB: dropzone
    ports:
      - "127.0.0.1:5432:5432"           # reachable from your machine only, not the network
    volumes:
      - dropzone-pgdata:/var/lib/postgresql/data

volumes:
  dropzone-pgdata: