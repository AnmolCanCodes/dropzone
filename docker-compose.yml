services:
  postgres:
    image: postgres:17-alpine
    container_name: dropzone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dropzone
      POSTGRES_PASSWORD: dropzone_dev_password
      POSTGRES_DB: dropzone
    ports:
      - "5432:5432"
    volumes:
      - dropzone-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropzone -d dropzone"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dropzone-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dropzone-redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dropzone-postgres-data:
  dropzone-redis-data: